[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refund-shark"
version = "0.1.0"
description = "Evidence-first service credit recovery. Models read; code decides."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "trafilatura>=2,<3",
  "pdfplumber>=0.11,<1",
  "python-dotenv>=1,<2",
  "anthropic>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "hypothesis>=6,<7",
    "reportlab>=4,<5",
]

[project.scripts]
shark = "shark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["shark", "api", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
